<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>The Alethiometer</title>
<style>
body{margin:0;min-height:100vh;background:radial-gradient(circle at center,#24354b 0%,#101923 45%,#05080c 100%);color:#ead7a2;font-family:Georgia,"Times New Roman",serif;display:flex;justify-content:center;align-items:center;text-align:center}.container{width:90%;max-width:700px;padding:40px 20px}.home{position:fixed;top:20px;left:22px;color:#d5b25c;text-decoration:none;letter-spacing:2px;font-size:13px}h1{font-size:48px;letter-spacing:4px;margin-bottom:5px}.subtitle{color:#b9aa82;margin-bottom:30px}.question-box{width:80%;padding:14px;border:1px solid #a88945;background:rgba(0,0,0,.35);color:white;font-size:17px;border-radius:5px}.alethiometer{width:380px;height:380px;margin:35px auto;border-radius:50%;position:relative;background:radial-gradient(circle,#efe2ad 0%,#cba85d 35%,#9c7430 60%,#493311 100%);border:14px solid #72521d;box-shadow:0 0 25px rgba(222,181,83,.5),inset 0 0 30px rgba(0,0,0,.7)}.symbol{position:absolute;font-size:28px;transform:translate(-50%,-50%)}.s1{top:7%;left:50%}.s2{top:25%;left:82%}.s3{top:65%;left:88%}.s4{top:90%;left:60%}.s5{top:90%;left:35%}.s6{top:65%;left:10%}.s7{top:25%;left:17%}.needle{position:absolute;width:4px;height:145px;background:#37220b;left:50%;top:50%;transform-origin:bottom center;border-radius:4px;transition:transform 2.5s cubic-bezier(.2,.8,.2,1)}#needle1{transform:translate(-50%,-100%) rotate(0deg)}#needle2{transform:translate(-50%,-100%) rotate(120deg)}#needle3{transform:translate(-50%,-100%) rotate(240deg)}.center{position:absolute;width:22px;height:22px;background:#30200c;border:4px solid #d5b25c;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10}button{background:#a57b32;border:none;padding:14px 30px;color:#fff4d1;font-family:Georgia,serif;font-size:16px;letter-spacing:2px;cursor:pointer;border-radius:4px}button:hover{background:#c29b4b}#answer{margin-top:30px;min-height:80px;font-size:20px;line-height:1.6;color:#efe2b5}@media(max-width:520px){h1{font-size:34px}.alethiometer{width:290px;height:290px}.needle{height:110px}}
</style></head><body><a class="home" href="index.html">← ARCHIVE</a><div class="container"><h1>ALETHIOMETER</h1><div class="subtitle">Ask a question. Read the symbols. Seek the truth.</div><input id="question" class="question-box" type="text" placeholder="What truth do you seek?"><div class="alethiometer"><div class="symbol s1">☀</div><div class="symbol s2">⚔</div><div class="symbol s3">⚓</div><div class="symbol s4">🌙</div><div class="symbol s5">👁</div><div class="symbol s6">⌛</div><div class="symbol s7">🕊</div><div class="needle" id="needle1"></div><div class="needle" id="needle2"></div><div class="needle" id="needle3"></div><div class="center"></div></div><button onclick="consultAlethiometer()">ASK THE ALETHIOMETER</button><div id="answer"></div></div><script>
const meanings=[{symbol:"The Sun",meaning:"truth, authority, and illumination"},{symbol:"The Sword",meaning:"conflict, courage, and decisive action"},{symbol:"The Anchor",meaning:"hope, stability, and persistence"},{symbol:"The Moon",meaning:"mystery, uncertainty, and hidden knowledge"},{symbol:"The Eye",meaning:"perception, knowledge, and watchfulness"},{symbol:"The Hourglass",meaning:"time, change, and mortality"},{symbol:"The Bird",meaning:"freedom, spirit, and escape"}];function consultAlethiometer(){const q=document.getElementById("question").value,a=document.getElementById("answer");if(q.trim()===""){a.innerHTML="The alethiometer waits for a question.";return}const n=[document.getElementById("needle1"),document.getElementById("needle2"),document.getElementById("needle3")],s=[];n.forEach(x=>{const i=Math.floor(Math.random()*meanings.length);s.push(meanings[i]);const angle=i*(360/meanings.length),turns=720+Math.random()*720;x.style.transform=`translate(-50%, -100%) rotate(${angle+turns}deg)`});a.innerHTML="The needles are searching...";setTimeout(()=>{a.innerHTML=`<strong>${s[0].symbol}</strong>, <strong>${s[1].symbol}</strong>, and <strong>${s[2].symbol}</strong> have answered.<br><br>Consider ${s[0].meaning}, ${s[1].meaning}, and ${s[2].meaning}.<br><br>The truth is not given directly. It must be interpreted.`},2600)}
</script></body></html>
